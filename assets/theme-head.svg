<svg xmlns="http://www.w3.org/2000/svg" width="880" height="80" viewBox="0 0 880 80" role="img" aria-labelledby="t d">
<title id="t">Theme Selector</title>
<desc id="d">Choose profile color deck</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#8b949e}.cy{fill:#00d9ff}.fg{fill:#c9d1d9}.gr{fill:#3fb950}.wh{fill:#f0fbff}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00d9ff" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>

</defs>
<path d="M16 -40V120M864 -40V120" fill="none" stroke="#00d9ff" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="80" fill="#03040a"/>
<rect x="16" y="0" width="848" height="80" fill="url(#grid)"/>
<text x="52" y="36" font-weight="700" fill="#00d9ff" filter="url(#g)" opacity=".8" style="font-size:18px">SYS://THEME_SELECT</text>
<text x="52" y="36" font-weight="700" style="font-size:18px"><tspan class="cy">SYS://</tspan><tspan class="wh">THEME_SELECT</tspan></text>
<text x="828" y="36" text-anchor="end" letter-spacing="1.5" class="dim" style="font-size:11px">COLOR_DECK: CYAN</text>
<g class="ln" style="animation-delay:.15s"><text x="52" y="62" class="dim"><tspan class="gr">$</tspan> config --set theme [profile] <tspan fill="#484f58"># click a deck below to switch</tspan></text></g>
<path d="M16 0V80M864 0V80" fill="none" stroke="#00d9ff" stroke-width="1.2"/>
<g fill="none" stroke="#00d9ff" stroke-width="2"></g>
</svg>
