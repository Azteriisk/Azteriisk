<title id="t">Tech stack</title>
<desc id="d">Tech stack. languages: Rust, C++, C, TypeScript, Python, Shell. systems: Linux, Wayland, Hyprland, Arch Linux, systemd. front-end: React, Next.js, Tailwind CSS, QML, HTML/CSS. tooling: Neovim, Git, Docker, Mise, CMake.</desc>
