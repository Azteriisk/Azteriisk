<svg xmlns="http://www.w3.org/2000/svg" width="176" height="80" viewBox="0 0 176 80" role="img" aria-labelledby="t d">
<title id="t">Theme: White</title>
<desc id="d">Switch color theme to White</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#9a9890}.cy{fill:#e8b84b}.fg{fill:#e8e6e0}.gr{fill:#6ee79a}.wh{fill:#fff8e7}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" x="24" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8b84b" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>

<rect x="0" y="0" width="176" height="80" fill="#0c0c0b"/>
<rect x="0" y="0" width="176" height="80" fill="url(#grid)"/>
<g class="ln" style="animation-delay:0.28s">
<path d="M39 12H151L163 24V68H39Z" fill="#ffffff" fill-opacity=".04"/>

<path d="M39 12H151L163 24V68H39Z" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1"/>
<path d="M151 12L163 24" stroke="#ffffff" stroke-width="2"/>
<circle cx="57" cy="34" r="4.5" fill="#ffffff"/>

<text x="68" y="38" font-weight="700" fill="#c9d1d9" style="font-size:12px">WHITE</text>
<text x="53" y="57" class="dim" style="font-size:10px;fill:#8b949e">○ SELECT</text>
</g>

</svg>
